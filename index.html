    margin-bottom: 15px;
}

.language-box button {
    border: 1px solid #c98735;

    color: #7d4616;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

.language-box button:hover {

}

.language-box button.active {
    background: #8b4513;
    color: white;
}

.icon {
    text-align: center;
    font-size: 48px;
}

h1 {
    text-align: center;
    color: #8b4513;
    font-size: 42px;
    margin: 8px 0;
}

.subtitle {

    color: #76553a;
    margin-bottom: 28px;
}

section {
    margin: 20px 0;
    padding: 18px;
    background: #fff8ec;
    border-left: 5px solid #d88924;
    border-radius: 10px;
}

h2 {
    margin: 0 0 10px;
    color: #9b4f16;
    font-size: 21px;
}

p {
    line-height: 1.7;
    margin: 0;
}

ul {
    line-height: 1.8;
    margin: 8px 0;
    padding-left: 25px;
}

.special {
    background: #fff3cf;
    border-left-color: #b87900;
}

.error {
    text-align: center;
    padding: 60px 15px;
}

@media (max-width: 600px) {

    .card {
        padding: 20px 15px;
    }

    h1 {
        font-size: 32px;
    }

    .language-box {
        justify-content: center;
    }
}
</style>
</head>

/* =====================================================
   LANGUAGE
   ===================================================== */

var currentLanguage = localStorage.getItem("ramLanguage") || "en";


function setLanguage(language) {

    currentLanguage = language;

    localStorage.setItem("ramLanguage", language);

    render();

}


/* =====================================================
   SHOW LOCATION
   ===================================================== */

function render() {

    var params = new URLSearchParams(window.location.search);

    var place = params.get("place");

    var app = document.getElementById("app");

    var englishButton = document.getElementById("englishBtn");

    var hindiButton = document.getElementById("hindiBtn");


    /* Highlight language button */

    englishButton.classList.remove("active");

    hindiButton.classList.remove("active");

    if (currentLanguage === "hi") {

        hindiButton.classList.add("active");

        document.documentElement.lang = "hi";

    } else {

        englishButton.classList.add("active");

        document.documentElement.lang = "en";

    }


    /* Invalid location */

    if (!place || !locations[place]) {

        app.innerHTML = `
            <div class="error">

                <div class="icon">🕉️</div>

                <h1>
                    ${currentLanguage === "hi"
                        ? "स्थान नहीं मिला"
                        : "Location Not Found"}
                </h1>

                <p>
                    ${currentLanguage === "hi"
                        ? "कृपया किसी मान्य स्थान का QR कोड स्कैन करें।"
                        : "Please scan a valid location QR code."}
                </p>

            </div>
        `;

        return;
    }


    var data = locations[place];

    var text = data[currentLanguage];


    /* Famous places */

    var placesHTML = "";

    if (text.places && text.places.length > 0) {

        placesHTML = `
            <section>

                <h2>${text.placesTitle}</h2>

                <ul>

                    ${text.places.map(function(item) {

                        return "<li>" + item + "</li>";

                    }).join("")}

                </ul>

            </section>
        `;

    }


    /* Food */

    var foodHTML = "";

    if (text.food) {

        foodHTML = `
            <section>

                <h2>${text.foodTitle}</h2>

                <p>${text.food}</p>

            </section>
        `;

    }


    /* Final page */

    app.innerHTML = `

        <div class="icon">
            ${data.icon}
        </div>

        <h1>
            ${text.title}
        </h1>

        <div class="subtitle">

            ${currentLanguage === "hi"
                ? "राम जी की वनवास यात्रा"
                : "Ram Ji’s Exile Journey"}

        </div>


        <section>

            <h2>
                ${text.aboutTitle}
            </h2>

            <p>
                ${text.about}
            </p>

        </section>


        <section>

            <h2>
                ${text.connectionTitle}
            </h2>

            <p>
                ${text.connection}
            </p>

        </section>


        <section>

            <h2>
                ${text.specialTitle}
            </h2>

            <p>
                ${text.special}
            </p>

        </section>


        ${placesHTML}

        ${foodHTML}


        <section class="special">

            <h2>
                ${text.messageTitle}
            </h2>

            <p>
                ${text.message}
            </p>

        </section>

    `;

}


/* Start page */

render();

</script>
