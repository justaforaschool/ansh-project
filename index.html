<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ram Ji's Exile Journey</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:#fff8e8;color:#3b2414}
.page{min-height:100vh;padding:25px 15px}
.card{max-width:850px;margin:auto;background:#fffdf7;border:1px solid #ead7b2;border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(80,45,10,.12)}
.icon{text-align:center;font-size:48px}
h1{text-align:center;color:#8b4513;font-size:42px;margin:8px 0}
.subtitle{text-align:center;color:#76553a;margin-bottom:28px}
section{margin:20px 0;padding:18px;background:#fff8ec;border-left:5px solid #d88924;border-radius:10px}
h2{margin:0 0 10px;color:#9b4f16;font-size:21px}
p{line-height:1.7;margin:0}
ul{line-height:1.8;margin:8px 0;padding-left:25px}
.special{background:#fff3cf;border-left-color:#b87900}
.error{text-align:center;padding:60px 15px}
@media(max-width:600px){.card{padding:20px 15px}h1{font-size:32px}}
</style>
</head>
<body>
<div class="page">
<div class="card" id="app"></div>
</div>

<script>
var locations = {
"ayodhya": {
icon:"🛕", title:"AYODHYA",
about:"Ayodhya is an ancient city on the banks of the Sarayu River in Uttar Pradesh. It is traditionally regarded as the birthplace of Lord Ram.",
connection:"Ayodhya was the kingdom of Ram Ji. He left Ayodhya with Sita Ji and Lakshman Ji to begin his 14-year exile. After completing the exile, they returned to Ayodhya.",
special:"Ayodhya is one of the most important pilgrimage cities associated with Lord Ram. It is famous for its temples, ghats and Ramayana heritage.",
places:["Ram Mandir","Hanuman Garhi","Kanak Bhawan","Saryu Ghat","Dasharath Bhawan"],
food:"Ayodhya is known for traditional North Indian vegetarian food, sweets and local snacks.",
message:"Ayodhya represents the beginning and end of Ram Ji’s exile journey—he left from here and returned here after 14 years."
},
"sringaverapura": {
icon:"🌊", title:"SRINGAVERAPURA",
about:"Sringaverapura was an ancient settlement situated near the Ganga River, traditionally identified with the present-day Singraur area of Uttar Pradesh.",
connection:"During his exile, Ram Ji, along with Sita Ji and Lakshman Ji, reached Sringaverapura after leaving Ayodhya. The Ramayana tradition connects this place with Nishadraj Guha, who welcomed and helped them.",
special:"The area is important for its ancient archaeological remains and its connection with the Ramayana tradition.",
places:["Ancient archaeological site","Ganga River and nearby ghats","Places associated with Nishadraj Guha"],
message:"Sringaverapura is remembered as an important early stop in Ram Ji’s journey into exile."
},
"prayag": {
icon:"🛕", title:"PRAYAG",
about:"Prayag, now known as Prayagraj, is a historic city in Uttar Pradesh. It is famous for the Triveni Sangam, the meeting point of the Ganga, Yamuna and traditionally believed Saraswati rivers.",
connection:"During his exile, Ram Ji, Sita Ji and Lakshman Ji travelled to Prayag and visited the ashram of Sage Bharadwaj. Sage Bharadwaj guided them towards Chitrakoot.",
special:"Prayagraj is an important pilgrimage and cultural centre, especially because of the Triveni Sangam.",
places:["Triveni Sangam","Bharadwaj Ashram","Allahabad Fort","Bade Hanuman Mandir"],
message:"Prayag was an important stop where Ram Ji received guidance before continuing towards Chitrakoot."
},
"chitrakoot": {
icon:"🌳", title:"CHITRAKOOT",
about:"Chitrakoot is a beautiful pilgrimage town associated with the Ramayana. It is located in the Vindhya region, on the Uttar Pradesh–Madhya Pradesh border.",
connection:"During his 14-year exile, Ram Ji, Sita Ji and Lakshman Ji spent a significant period in Chitrakoot. They lived in the forest and visited the Mandakini River.",
special:"Chitrakoot is famous for its spiritual importance, forests, hills, rivers and many temples connected with the Ramayana tradition.",
places:["Ramghat","Kamadgiri","Hanuman Dhara","Gupt Godavari","Sati Anasuya Ashram","Mandakini River"],
message:"Chitrakoot is one of the most important places associated with Ram Ji's life during exile."
},
"dandakaranya": {
icon:"🌲", title:"DANDAKARANYA",
about:"Dandakaranya was a vast forest region mentioned in the Ramayana. It covered parts of present-day central and southern India.",
connection:"During their exile, Ram Ji, Sita Ji and Lakshman Ji travelled through the forests of Dandakaranya. They met several sages and lived in the forest.",
special:"The region is known for its forests, tribal culture, rivers and natural beauty.",
places:["Dense forest regions","Tribal cultural areas","Waterfalls and rivers","Wildlife and natural landscapes"],
message:"Dandakaranya represents the long forest journey of Ram Ji during his exile."
},
"panchavati": {
icon:"🌿", title:"PANCHAVATI / NASHIK",
about:"Panchavati is an important area of Nashik, Maharashtra, situated near the Godavari River.",
connection:"Ram Ji, Sita Ji and Lakshman Ji lived at Panchavati during their exile. Many important events of the Ramayana are traditionally associated with this place, including Sita Ji's abduction by Ravana.",
special:"Panchavati is a major pilgrimage area and is famous for its temples and connection with the Ramayana.",
places:["Ram Kund","Kalaram Temple","Sita Gufa","Panchavati area","Godavari River ghats"],
message:"Panchavati is one of the most important places connected with Ram Ji, Sita Ji and Lakshman Ji during their exile."
},
"kishkindha": {
icon:"🐒", title:"KISHKINDHA",
about:"Kishkindha is the ancient kingdom associated with the Vanaras in the Ramayana. It is traditionally connected with the Hampi region of Karnataka.",
connection:"Ram Ji met Hanuman Ji and Sugriva here. Ram helped Sugriva, and the Vanara army helped Ram search for Sita Ji.",
special:"The Hampi region is famous for its ancient monuments, rocky hills and temples.",
places:["Hampi","Anjanadri Hill","Tungabhadra River","Virupaksha Temple","Matanga Hill"],
message:"Kishkindha is remembered as the place where Ram Ji met Hanuman Ji."
},
"rameswaram": {
icon:"🌊", title:"RAMESWARAM",
about:"Rameswaram is a famous pilgrimage town on Pamban Island in Tamil Nadu, near the southern coast of India.",
connection:"According to the Ramayana tradition, Ram Ji reached the southern coast with the Vanara army while preparing to travel to Lanka. The tradition associates the area with the Ram Setu.",
special:"Rameswaram is one of India's important pilgrimage destinations and is famous for its temples and beautiful coastal surroundings.",
places:["Ramanathaswamy Temple","Pamban Bridge","Dhanushkodi","Agni Theertham","Ram Setu area"],
message:"Rameswaram is traditionally associated with the journey towards Lanka and the Ram Setu."
},
"lanka": {
icon:"🏝️", title:"LANKA",
about:"Lanka is the island kingdom ruled by Ravana in the Ramayana. It is traditionally associated with present-day Sri Lanka.",
connection:"Ram Ji's army crossed towards Lanka to rescue Sita Ji. Ram Ji fought Ravana and defeated him, after which Sita Ji was reunited with Ram Ji.",
special:"Sri Lanka is famous for its beautiful beaches, forests, mountains, ancient cities and cultural heritage.",
places:["Sigiriya","Kandy","Galle","Colombo","Ancient Anuradhapura"],
message:"Lanka represents the final great battle of Ram Ji's exile journey."
}
};

function getPlace(){
var params=new URLSearchParams(window.location.search);
return params.get("place");
}

function show(){
var key=getPlace();
var data=locations[key];
var app=document.getElementById("app");

if(!data){
app.innerHTML='<div class="error"><div class="icon">🕉️</div><h1>Location Not Found</h1><p>Please scan a valid location QR code.</p></div>';
return;
}

var places="";
if(data.places){
places="<section><h2>📍 Famous Places Today</h2><ul>";
for(var i=0;i<data.places.length;i++){places+="<li>"+data.places[i]+"</li>";}
places+="</ul></section>";
}

var food="";
if(data.food){
food="<section><h2>🍛 Famous Food</h2><p>"+data.food+"</p></section>";
}

app.innerHTML=
'<div class="icon">'+data.icon+'</div>'+
'<h1>'+data.title+'</h1>'+
'<div class="subtitle">Ram Ji’s Exile Journey</div>'+
'<section><h2>About the Place</h2><p>'+data.about+'</p></section>'+
'<section><h2>Connection with Ram Ji</h2><p>'+data.connection+'</p></section>'+
'<section><h2>⭐ What is Special Today</h2><p>'+data.special+'</p></section>'+
places+food+
'<section class="special"><h2>🌟 Special Message</h2><p>'+data.message+'</p></section>';
}

show();
</script>
</body>
</html>
